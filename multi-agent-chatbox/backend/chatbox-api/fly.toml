app = "devin-chatbox-api-v5"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"
  build-target = "app"

[env]
  PORT = "8080"
  DEEPSEEK_API_BASE = "https://api.deepseek.com"
  DEEPSEEK_API_KEY = "sk-ee8827e619f2436183348920a525a7b7"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
